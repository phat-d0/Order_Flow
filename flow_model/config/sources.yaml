# Source endpoints, limits and clock precision. Owners verify and update in Phase 2.
storage:
  root: "data"                       # raw parquet store (gitignored), relative to repo root

coinbase:
  ws_url: "wss://ws-feed.exchange.coinbase.com"
  rest_url: "https://api.exchange.coinbase.com"
  channels: ["matches", "ticker", "level2_batch"]   # level2 may require auth; level2_batch is public
  ts_precision: "us"
  reconnect_backoff_s: [1, 2, 5, 10, 30]
  heartbeat_timeout_s: 30
  flush_every_s: 60

binance:
  archive_url: "https://data.binance.vision/data"
  spot_aggtrades_path: "spot/daily/aggTrades"
  futures_bookticker_path: "futures/um/daily/bookTicker"
  ts_precision: "ms"

alpaca:
  data_url: "https://data.alpaca.markets/v2"
  feed: "iex"
  key_env: "ALPACA_API_KEY_ID"           # env var (identifier)
  secret_env: "ALPACA_API_SECRET_KEY"     # env var, OR network secret injected by the cloud proxy
  secret_header: "APCA-API-SECRET-KEY"
  key_header: "APCA-API-KEY-ID"
  secret_placeholder: "injected-by-proxy"  # sent when the secret env var is absent; the proxy replaces it
  max_requests_per_min: 200          # free plan limit; verify
  page_limit: 10000
  ts_precision: "ns"
  # --- added by Equities agent (Phase 2) ---
  sort: "asc"                         # page order; storage re-sorts anyway
  timeout_s: 30                       # per-request HTTP timeout
  retry_backoff_s: [1, 2, 5, 10, 30]  # waits between retries on 429 / 5xx / connection errors
  retry_statuses: [429, 500, 502, 503, 504]
  max_pages: 2000                     # safety cap per fetch() call (2000 x 10k rows)
  check_symbol: "SPY"                 # symbol used by check() (latest-trade probe)
  user_agent: "flow-model-research/0.1"
  rth_tz: "America/New_York"          # regular trading hours window used by the pull CLI
  rth_open: "09:30"
  rth_close: "16:00"
  lookback_days: 10                   # pull CLI: how many calendar days back to look for the last full RTH day
  full_day_probe_min: 1               # a day is "full" if trades exist in the last N minutes before rth_close
  depth_probe_start: "2015-01-01"     # depth CLI: earliest date asked for when probing history depth
  log_every_pages: 50                 # progress log cadence during fetch()

dukascopy:
  base_url: "https://datafeed.dukascopy.com/datafeed"
  price_scale: 100000                # EURUSD points per unit price
  request_pause_s: 0.5
  ts_precision: "ms"

yfinance:
  interval: "1m"
  max_days_per_request: 7
  request_pause_s: 1.0
  ts_precision: "s"
