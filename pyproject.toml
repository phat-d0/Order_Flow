[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow_model"
version = "0.1.0"
description = "Research-only order-flow and price-impact modelling on free market data (no broker, no orders)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "websockets>=12",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "plotly>=5.20",
    "streamlit>=1.35",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["flow_model*"]

[tool.setuptools.package-data]
flow_model = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["flow_model/tests"]
addopts = ""
markers = ["network: hits a live data source (deselect with -m 'not network')"]
